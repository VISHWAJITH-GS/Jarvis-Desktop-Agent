[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-desktop-agent"
version = "1.0.0"
description = "Real-time AI voice assistant for desktop with durable autonomy (based on Mark LVI by FatihMakes)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-NC-4.0" }
authors = [
    { name = "vishwajith-gs" },
    { name = "FatihMakes", email = "fatih@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "third_party",
    "venv",
    ".venv",
    "build",
    "dist",
    ".git",
    "copy UI",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module level import not at top of file
    "F403",  # star imports (used in GUI package architecture)
    "F405",  # star import name undefined
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"ui.py" = ["F401"]
"main.py" = ["F401"]
"core/*" = ["F401"]
"gui/*" = ["F401"]
"plugins/_template.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
markers = [
    "requires_hardware: Tests requiring a live desktop, live audio devices, or external network access",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["core", "actions", "gui", "memory", "dashboard"]
omit = [
    "tests/*",
    "scripts/*",
    "third_party/*",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
