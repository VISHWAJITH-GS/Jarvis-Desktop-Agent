name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ruff coverage mypy pytest pytest-cov
          # On Windows runners use requirements.lock; on Linux/Ubuntu use requirements.txt
          # to properly evaluate platform markers and skip Windows-only binary packages.
          if [ "$RUNNER_OS" = "Windows" ] && [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi

      - name: Lint check (ruff)
        run: |
          ruff check . --select=E9,F63,F7,F82 --exclude=.git,__pycache__,scratch,build,dist,reports

      - name: Type check (mypy)
        run: |
          mypy core/ducking.py core/audio_devices.py core/permissions.py --ignore-missing-imports --follow-imports=silent

      - name: Run unit test suite with coverage
        run: |
          pytest -m "not requires_hardware" --cov=core --cov=gui --cov-report=term --cov-fail-under=20
