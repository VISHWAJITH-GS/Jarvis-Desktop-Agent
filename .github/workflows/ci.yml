name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Lint
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff coverage mypy
          if (Test-Path requirements.lock) {
            pip install -r requirements.lock
          } else {
            pip install -r requirements.txt
          }

      - name: Lint check (ruff)
        run: |
          ruff check . --select=E9,F63,F7,F82 --exclude=.git,__pycache__,scratch,build,dist,reports

      - name: Type check (mypy)
        run: |
          mypy core/ducking.py core/audio_devices.py core/permissions.py --ignore-missing-imports --follow-imports=silent

      - name: Run unit test suite with coverage
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py"
          coverage report -m --fail-under=20

