name: Daily Maintenance & Code Hardening

on:
  schedule:
    # 21:30 UTC = 03:00 AM IST (UTC + 5:30)
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Run Daily Maintenance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install maintenance dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pydantic ruff pytest

      - name: Configure Git Author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Execute Daily Maintenance & Create PR
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/daily_maintenance.py --apply --branch --create-pr
